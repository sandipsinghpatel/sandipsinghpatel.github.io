    <path d="M60 22 V63" stroke-width="3.8"/>
    <path d="M52 29 C42 31 40 38 47 42"/>
    <path d="M51 47 C41 49 39 56 47 59"/>
    <path d="M68 29 C78 31 80 38 73 42"/>
