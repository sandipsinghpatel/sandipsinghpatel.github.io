current:
  - name: Dr Sandip Kumar Patel
    role: Principal Investigator · Director, Proteomics Facility
    photo: assets/img/members/sandip.jpg
    email: skp59@cam.ac.uk
    bio: >
      Sandip trained in quantitative proteomics and clinical biomarker discovery at IIT Bombay
      (integrated M.Sc.–Ph.D.), then joined the Buck Institute for Research on Aging as a Glenn
      Postdoctoral Fellow, where he studied cellular senescence and extracellular vesicles.
      Since 2023 he has directed the Proteomics Facility at the MRC Toxicology Unit, University
      of Cambridge, where his research focuses on healthy brain ageing, senescence-driven
      neuroinflammation and extracellular-vesicle therapeutics.
    links:
