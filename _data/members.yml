current:
  - name: Dr Sandip Kumar Patel
    role: Group Leader · Director, Proteomics Facility
    photo: assets/img/members/sandip.jpg
    email: skp59@cam.ac.uk
    bio: >
      Sandip trained in quantitative proteomics and clinical biomarker discovery at IIT Bombay, where his
      integrated M.Sc.–Ph.D. work used proteomics and metabolomics to dissect the pathogenesis of severe
      vivax malaria. He then joined the Buck Institute for Research on Aging in California as a Glenn
      Postdoctoral Fellow (2019–2023), working on cellular senescence, the senescence-associated secretory
      phenotype and extracellular vesicles. Since 2023 he has directed the Proteomics Facility at the MRC
      Toxicology Unit, University of Cambridge, where his research connects senescence and
      extracellular-vesicle biology to healthy brain ageing and neuroinflammation. He has published in
      Nature, Aging, EMBO Molecular Medicine and Analytical Chemistry, reviews for Nature Communications,
      and serves as a Reviewer Editor for Frontiers in Molecular Biosciences. He also runs Bio-info, a
      YouTube channel of short scientific explainers, for which he received a Bronze SciComm Star award.
    links:
      - label: Google Scholar
        url: https://scholar.google.com/
      - label: ORCID
        url: https://orcid.org/

